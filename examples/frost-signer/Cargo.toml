[package]
name = "frost-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "frost-signer"

[features]
default = ["gui"]
gui = ["slint", "slint-build"]

[[bin]]
name = "frost-signer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bip375-helpers.workspace = true
bitcoin.workspace = true
frost-secp256k1-tr.workspace = true
hex.workspace = true
k256 = "0.13"
psbt.workspace = true
psbt-v2.workspace = true
rand = { version = "0.8", features = ["std", "std_rng"] }
secp256k1.workspace = true
silentpayments.workspace = true
slint = { version = "1.8", optional = true }
thiserror.workspace = true

[build-dependencies]
slint-build = { version = "1.8", optional = true }
