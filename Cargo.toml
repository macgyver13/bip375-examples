[workspace]
resolver = "2"
members = [
    "crates/bip375-helpers",
    "crates/spdk-uniffi",
    "examples/hardware-signer",
    "examples/frost-signer",
    "examples/multi-signer",
    "examples/musig2-signer",
    "tools/psbt-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BIP-375 Contributors"]
repository = "https://github.com/bitcoin/bips"

[workspace.dependencies]
bitcoin = "0.32.6"
frost-secp256k1-tr = "3.0.0"
psbt = { git = "https://github.com/macgyver13/spdk.git", branch = "musig2-working" }
# Native PSBT v2 types/signing used directly by examples (matches spdk's pin)
psbt-v2 = { git = "https://gitea.bitcoin.ninja/macgyver/rust-psbt.git", branch = "musig2-working", features = ["miniscript", "musig2", "silent-payments"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context", "serde"] }
sha2 = "0.10"
silentpayments = { git = "https://github.com/macgyver13/spdk.git", branch = "musig2-working" }

# Serialization
base64 = "0.21"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# BIP-353 (Human-Readable Bitcoin Addresses) with DNSSEC validation
dnssec-prover = { version = "0.6", features = ["std", "tokio", "validation"] }
tokio = { version = "1", features = ["rt", "macros", "net"] }

# Internal crates
bip375-helpers = { path = "crates/bip375-helpers" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = { level = "deny", priority = 1 }
expect_used = "allow"
